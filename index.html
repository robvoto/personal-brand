<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta name="theme-color" content="#0b0d12">
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#content" data-render="skip-link"></a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#home" data-render="brand"></a>
      <nav class="nav" aria-label="Primary" data-render="nav"></nav>
    </div>
  </header>

  <main id="content" class="page">
    <section class="hero" id="home">
      <div class="hero-grid">
        <div data-render="hero-copy"></div>

        <aside class="hero-card" aria-label="" data-render="hero-video-label">
          <div class="hero-video" data-render="hero-video"></div>
        </aside>
      </div>
    </section>

    <section class="section" id="capabilities">
      <div class="section-head" data-render="section-capabilities"></div>
      <div class="card-grid three" data-render="capabilities"></div>
    </section>

    <section class="section" id="skills">
      <div class="section-head" data-render="section-toolkit"></div>
      <div class="card-grid four" data-render="toolkit"></div>
    </section>

    <section class="section" id="experience">
      <div class="section-head" data-render="section-case-studies"></div>
      <div class="card-grid four" data-render="case-studies"></div>
    </section>

    <section class="section" id="work">
      <div class="section-head" data-render="section-applied-ai"></div>
      <div class="card-grid applied-grid" data-render="applied-ai"></div>
    </section>

    <section class="section" id="work-samples">
      <div class="section-head" data-render="section-ba-work-samples"></div>
      <div data-render="ba-work-samples"></div>
    </section>

    <section class="section" id="industries">
      <div class="section-head" data-render="section-industries"></div>
      <div class="card-grid four" data-render="industries"></div>
    </section>

    <section class="section" id="credentials">
      <div class="section-head" data-render="section-education"></div>
      <div class="card-grid three" data-render="education-top"></div>
      <div class="card-grid three credential-grid" data-render="education-bottom"></div>
    </section>

    <section class="section" id="contact">
      <div class="section-head" data-render="section-contact"></div>
      <div class="contact" data-render="contact"></div>
    </section>
  </main>

  <footer data-render="footer"></footer>
  <script src="data.js" defer></script>
  <script src="render.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
